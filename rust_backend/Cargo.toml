# Workspace layout and pins derived from Mornye's rust_backend
# (https://github.com/mornyeapp/Mornye, Copyright 2026 zarzet, LGPL-3.0-only).
[workspace]
members = ["crates/core", "crates/network", "crates/mobile", "crates/bindgen"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
kalao-core = { path = "crates/core" }
kalao-network = { path = "crates/network" }
base64 = "0.23"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
thiserror = "2.0"
uniffi = { version = "=0.32.2", default-features = false }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
rustls-platform-verifier = "=0.7.1"
rustls-pemfile = "2.2"
http = "1.4"
http-body-util = "0.1"
bytes = "1.11"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
tower-service = "0.3"
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
cookie = "0.18"
url = "2.5"
regex = "=1.13.1"
unicode-normalization = "=0.1.22"
unicode-general-category = "=0.6.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
roxmltree = "=0.21.2"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
